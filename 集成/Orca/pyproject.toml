[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-layer-smoothing"
version = "0.2.1"
description = "Smooth layer times using model infill speed"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["orca_layer_smoothing"]

[tool.setuptools.package-data]
orca_layer_smoothing = ["preview.html", "demo.json", "planner.js"]
